name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 3

  e2e:
    name: Playwright (behaviour + 16 screenshots)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    needs: e2e
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: wrangler deploy
        id: deploy
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Preferred: a scoped API token. Fallback: Global API Key (+ account email).
          if [ -n "${CF_API_TOKEN}" ]; then
            export CLOUDFLARE_API_TOKEN="${CF_API_TOKEN}"
            echo "auth: scoped API token"
          elif [ -n "${CF_GLOBAL_API_KEY}" ] && [ -n "${CF_EMAIL}" ]; then
            export CLOUDFLARE_API_KEY="${CF_GLOBAL_API_KEY}"
            export CLOUDFLARE_EMAIL="${CF_EMAIL}"
            echo "::warning::Deploying with the Global API Key. Replace it with a scoped API token (CLOUDFLARE_API_TOKEN)."
          elif [ -n "${CF_GLOBAL_API_KEY}" ]; then
            # The secret may actually hold an API token despite its name.
            export CLOUDFLARE_API_TOKEN="${CF_GLOBAL_API_KEY}"
            echo "::warning::CLOUDFLARE_GLOBAL_API_KEY used as an API token (no CLOUDFLARE_EMAIL secret set)."
          else
            echo "::error::No Cloudflare credentials. Add CLOUDFLARE_API_TOKEN (recommended) in Settings → Secrets and variables → Actions."
            exit 1
          fi
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
